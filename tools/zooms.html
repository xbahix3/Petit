<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Gros plans</title>
<style>body{margin:0;background:#FFF6E6;font:16px sans-serif}.g{display:grid;grid-template-columns:repeat(7,180px);gap:10px;padding:10px}
.c{text-align:center}.c div{width:170px;height:170px;border-radius:50%;overflow:hidden;border:5px solid #F5A524;margin:auto}.c svg{width:100%;height:100%;display:block}
.p div{border-radius:18px;border-color:#2E9E6A}</style></head><body><div class="g" id="g"></div>
<script src="../js/core.js"></script><script src="../js/data.js"></script><script src="../js/art/build.js"></script>
<script src="../js/art/plates.js"></script><script src="../js/ui.js"></script>
<script>
Object.keys(PR.plates).forEach(function(k){PR.plates[k].img='../'+PR.plates[k].img;});
var g=document.getElementById('g');
PR.data.cards.forEach(function(c){g.insertAdjacentHTML('beforeend','<div class="c"><div>'+PR.zoomSVG(c)+'</div>'+c.full+'</div>');});
PR.data.animals.forEach(function(a){g.insertAdjacentHTML('beforeend','<div class="c p"><div>'+PR.portraitSVG(a.id)+'</div>'+a.name+'</div>');});
</script></body></html>
